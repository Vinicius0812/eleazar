<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Eleazar · o regente</title>
  <!-- Main mark, a nod to the Brazilian conductor Eleazar de Carvalho: a conductor in tailcoat raising the baton,
       with the small mark (the E of the baton and the agents) as a badge in the bottom right corner. -->
  <defs>
    <linearGradient id="eleazar-maestro-bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7b66e0"/>
      <stop offset="1" stop-color="#33267d"/>
    </linearGradient>
    <clipPath id="eleazar-maestro-tile"><rect width="256" height="256" rx="58"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#eleazar-maestro-bg)"/>
  <g clip-path="url(#eleazar-maestro-tile)">
    <g transform="translate(0 30)">
      <path d="M136 106 L170 84 L180 46" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M84 106 L56 126 L44 96" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M182 40 L204 12" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
      <circle cx="206" cy="10" r="8" fill="#f4c95d"/>
      <circle cx="110" cy="62" r="22" fill="#ffffff"/>
      <path d="M78 104 C78 96 86 92 94 92 L126 92 C134 92 142 96 142 104 L140 240 L80 240 Z" fill="#ffffff"/>
      <path d="M98 94 L110 140 L122 94" fill="none" stroke="#4a3aa8" stroke-width="5" stroke-linejoin="round"/>
      <path d="M100 92 L110 98 L120 92 L120 104 L110 98 L100 104 Z" fill="#4a3aa8"/>
    </g>
  </g>
  <!-- badge: the small mark -->
  <circle cx="196" cy="196" r="44" fill="#ffffff"/>
  <circle cx="196" cy="196" r="38" fill="#2f2378"/>
  <g transform="translate(154 161.4) scale(0.3)">
    <path d="M198 41 Q222 92 186 131 Q158 162 186 190" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
    <path d="M140 72 L78 72 L78 190 L150 190" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M78 131 L148 131" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
    <circle cx="186" cy="190" r="16" fill="#ffffff"/>
    <circle cx="186" cy="131" r="16" fill="#ffffff"/>
    <path d="M140 72 L192 44" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <circle cx="198" cy="41" r="16" fill="#f4c95d"/>
  </g>
</svg>
