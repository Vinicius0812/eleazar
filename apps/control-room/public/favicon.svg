<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Eleazar</title>
  <!-- Small mark: an E whose top bar lifts into the conductor's baton (gold tip) and whose other bars end
       in the agents it conducts, joined by the trail of the beat. Made to read at 16 px. -->
